<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7851A9">
<title>Nova Chat</title>
<script>
  /* apply saved theme before paint (no flash) */
  try { var t = localStorage.getItem('nova_theme');
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch (e) {}
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: { colors: { gold: '#FFBF00', steel: '#6a92b5', royal: '#7851A9' } } } };
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>

<!-- Firebase (compat SDK, works without a bundler). If offline/unconfigured the app falls back to Demo mode. -->
<script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.1.0/firebase-storage-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="backend.js"></script>
<script src="core.js"></script>
<script src="auth.js"></script>
<script src="chat.js"></script>
<script src="extras.js"></script>
<script src="main.js"></script>
</body>
</html>
